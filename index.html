<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIDTERM LIST</title>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #fdbb2d;
            --bg: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin: 20px 0;
            font-weight: 800;
        }

        .grid-container {
            display: grid;
            /* 모바일 화면에서 한 줄에 4~5개씩 예쁘게 정렬 */
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            color: var(--primary);
            text-decoration: none;
            height: 65px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #eee;
            /* 터치 시 회색 잔상 제거 */
            -webkit-tap-highlight-color: transparent;
        }

        /* 클릭(터치)했을 때 반응 */
        .grid-item:active {
            background-color: var(--accent);
            transform: scale(0.92);
            border-color: var(--primary);
        }

        footer {
            margin-top: 40px;
            padding-bottom: 20px;
            color: #bbb;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>📝 MIDTERM EXAM</h1>

    <div class="grid-container" id="linkGrid">
        </div>

    <footer>Questions 1 to 53</footer>

    <script>
        const gridContainer = document.getElementById('linkGrid');
        
        for (let i = 1; i <= 53; i++) {
            const link = document.createElement('a');
            
            // 깃허브에서 가장 안전한 상대 경로 방식
            // 폴더 구조상 같은 위치에 있는 파일을 찾습니다.
            link.href = i + ".html"; 
            
            link.className = 'grid-item';
            link.textContent = i;
            gridContainer.appendChild(link);
        }
    </script>
</body>
</html>
